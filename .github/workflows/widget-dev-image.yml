name: Widget development image

on:
  push:
    branches:
      - feat/web-wiring-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build development image (${{ matrix.arch }})
    if: github.ref == 'refs/heads/feat/web-wiring-deploy'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout branch commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          IMAGE_REPO="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${IMAGE_REPO}/zaq-dev" >> "${GITHUB_OUTPUT}"

      # Each native runner publishes an immutable image, not the shared tags.
      # Tags are published only after both architecture builds succeed.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=widget-dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=widget-dev-${{ matrix.arch }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: ${DIGEST}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Publish multi-arch development image
    needs: docker-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image_tags
        run: |
          set -euo pipefail

          IMAGE_REPO="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${IMAGE_REPO}/zaq-dev"

          TAGS=(
            "${IMAGE}:latest"
            "${IMAGE}:sha-${GITHUB_SHA}"
          )

          {
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Merge image manifests and publish development tags
        env:
          TAGS: ${{ steps.image_tags.outputs.tags }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          IMAGE_REPO="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${IMAGE_REPO}/zaq-dev"
          DIGEST_FILES=("${RUNNER_TEMP}"/digests/*)
          if [[ "${#DIGEST_FILES[@]}" -ne 2 ]]; then
            echo "Expected exactly two architecture image digests" >&2
            exit 1
          fi

          IMAGES=()
          for FILE in "${DIGEST_FILES[@]}"; do
            DIGEST="${FILE##*/}"
            if [[ ! "${DIGEST}" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Invalid image digest filename: ${DIGEST}" >&2
              exit 1
            fi
            IMAGES+=("${IMAGE}@sha256:${DIGEST}")
          done

          TAG_ARGS=()
          while IFS= read -r TAG; do
            [[ -z "${TAG}" ]] || TAG_ARGS+=(--tag "${TAG}")
          done <<< "${TAGS}"

          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGES[@]}"

      - name: Verify multi-arch manifest
        run: |
          set -euo pipefail

          IMAGE_REPO="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${IMAGE_REPO}/zaq-dev:sha-${GITHUB_SHA}"

          INSPECT_OUTPUT="$(docker buildx imagetools inspect "${IMAGE}")"
          echo "${INSPECT_OUTPUT}"

          [[ "${INSPECT_OUTPUT}" == *"linux/amd64"* ]]
          [[ "${INSPECT_OUTPUT}" == *"linux/arm64"* ]]
