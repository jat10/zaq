name: Widget development image

on:
  push:
    branches: [feat/web-widget-wire]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    if: github.ref == 'refs/heads/feat/web-widget-wire'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Select development image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zaq-dev" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=widget-dev-${{ matrix.arch }}
          cache-to: type=gha,scope=widget-dev-${{ matrix.arch }},mode=max

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and verify platforms
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zaq-dev"
          build_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:sha-${GITHUB_SHA}" \
            "${image}:${build_tag}-amd64" \
            "${image}:${build_tag}-arm64"
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" --raw > manifest.json
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] |
            index("linux/amd64") != null and index("linux/arm64") != null
          ' manifest.json
          {
            echo "Built both linux/amd64 and linux/arm64."
            echo
            echo "Pull this tested build candidate:"
            echo
            echo '```bash'
            echo "docker pull ${image}:sha-${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
